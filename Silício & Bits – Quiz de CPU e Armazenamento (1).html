<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silício &amp; Bits – Quiz de CPU e Armazenamento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* ===== CORES (tema escuro por padrão; claro se o sistema preferir) ===== */
:root{--bg:#0d1226;--panel:#151b38;--ink:#eaf0ff;--mut:#97a2c9;--cu:#f0a04b;--cy:#4de1d2;--ok:#5be3a0;--err:#ff6b81;--line:#2b3566;--grid:rgba(77,225,210,.07);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f4fb;--panel:#fff;--ink:#17204a;--mut:#56608a;--cu:#c4701a;--cy:#0f9d94;--ok:#0f9a62;--err:#d1405a;--line:#cdd4ea;--grid:rgba(15,157,148,.08)}}
:root[data-theme="dark"]{--bg:#0d1226;--panel:#151b38;--ink:#eaf0ff;--mut:#97a2c9;--cu:#f0a04b;--cy:#4de1d2;--ok:#5be3a0;--err:#ff6b81;--line:#2b3566;--grid:rgba(77,225,210,.07)}
html,body{margin:0;min-height:100%}
/* fundo: brilho no topo + malha de placa de circuito */
body{background:radial-gradient(900px 480px at 50% -8%,color-mix(in srgb,var(--cy) 20%,transparent),transparent),
 linear-gradient(var(--grid) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/34px 34px,var(--bg);
 color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:720px;padding:26px 18px 40px;box-sizing:border-box}
h1,h2,.no i,.chip,.btn{font-family:"Chakra Petch",Verdana,sans-serif}
button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
/* logo: um chip com "pinos" feitos de borda pontilhada */
.hero{text-align:center;margin-bottom:26px}
.chip{display:inline-grid;place-items:center;width:62px;height:62px;margin:14px 0 18px;background:var(--cu);color:#1b1206;font-weight:700;border-radius:8px;position:relative;box-shadow:0 0 32px color-mix(in srgb,var(--cu) 55%,transparent)}
.chip::before{content:"";position:absolute;inset:-10px;border:5px dotted var(--cu);border-radius:4px;opacity:.8}
h1{font-size:clamp(2.1rem,7vw,3.3rem);margin:0;letter-spacing:1px;line-height:1.1}
h1 span{color:var(--cy)}
.sub{color:var(--mut);margin:.5em auto 0;max-width:46ch}
/* mapa: fases ligadas por uma "trilha" de circuito */
.map{display:grid;gap:14px;position:relative;padding-left:26px}
.map::before{content:"";position:absolute;left:11px;top:20px;bottom:20px;width:3px;background:linear-gradient(var(--cy),var(--cu));opacity:.5;border-radius:2px}
.no{display:grid;grid-template-columns:auto 1fr auto;gap:0 14px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;position:relative;transition:transform .15s,border-color .15s}
.no::before{content:"";position:absolute;left:-22px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--cy);box-shadow:0 0 12px var(--cy)}
.no:hover:not(:disabled){transform:translateX(4px);border-color:var(--cu)}
.no i{grid-row:1/3;font-style:normal;font-size:1.6rem;font-weight:700;color:var(--cu)}
.no b{font-weight:600}.no small{color:var(--mut)}
.no em{grid-row:1/3;grid-column:3;font-style:normal;color:var(--cu);letter-spacing:2px}
.no:disabled{opacity:.5;cursor:not-allowed}.no:disabled::before{background:var(--line);box-shadow:none}
.foot{text-align:center;color:var(--mut);margin-top:24px}
/* tela de pergunta */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-weight:600;font-size:.95rem}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 14px}
.vidas{color:var(--err);letter-spacing:3px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:100%;background:var(--cy);box-shadow:0 0 10px var(--cy);transition:width .1s linear}
.bar i.baixo{background:var(--err);box-shadow:0 0 10px var(--err)}
.q{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--cu);border-radius:10px;padding:22px 20px;font-size:1.22rem;font-weight:600;margin-bottom:16px;box-shadow:0 10px 34px rgba(0,0,0,.25)}
.ops{display:grid;gap:10px}
.op{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not(:disabled){border-color:var(--cy);transform:translateY(-1px)}
.op .k{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--line);font:700 .9rem "Chakra Petch",sans-serif}
.op.certa{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--panel));animation:pulso .5s}
.op.errada{border-color:var(--err);background:color-mix(in srgb,var(--err) 20%,var(--panel));animation:tremer .4s}
.op.some{visibility:hidden}
@keyframes pulso{50%{transform:scale(1.025)}}
@keyframes tremer{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{background:var(--cu);color:#1b1206;border:0;border-radius:8px;padding:11px 22px;font-weight:700;font-size:1rem;cursor:pointer;margin:16px 10px 0 0}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.exp{margin-top:16px;padding:12px 16px;border-left:4px solid var(--cy);background:var(--panel);border-radius:0 8px 8px 0;color:var(--mut)}
.exp strong{color:var(--ink)}
.fim{text-align:center;padding-top:28px}
.est{font-size:2.8rem;color:var(--cu);letter-spacing:8px}
.est span{display:inline-block;animation:surge .5s both}
@keyframes surge{from{transform:scale(0) rotate(-90deg);opacity:0}}
.rank{display:inline-block;border:1px solid var(--cu);border-radius:99px;padding:4px 18px;color:var(--cu);font-weight:700;margin:6px 0 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   BANCO DE PERGUNTAS
   Cada pergunta: [enunciado, resposta certa, [3 erradas], explicação]
   As alternativas são embaralhadas na hora de jogar.
   ===================================================================== */
const FASES = [
 { nome:"Siglas do computador", desc:"O que cada sigla significa em inglês", p:[
  ["CPU é a sigla de qual expressão em inglês?","Central Processing Unit",["Central Program Utility","Computer Power Unit","Core Processing Update"],"Em português: Unidade Central de Processamento, o 'cérebro' do PC."],
  ["A sigla RAM vem de...","Random Access Memory",["Read Access Module","Rapid Archive Memory","Remote Active Memory"],"Memória de Acesso Aleatório: guarda os dados que estão em uso enquanto o PC está ligado."],
  ["GPU significa...","Graphics Processing Unit",["General Power Unit","Game Processing Update","Graphic Program Utility"],"É o processador gráfico, responsável por imagens, jogos e vídeos."],
  ["Qual expressão está por trás da sigla USB?","Universal Serial Bus",["United System Board","Universal Storage Block","Ultra Speed Byte"],"Serial Bus = barramento serial. 'Universal' porque serve para muitos dispositivos."],
  ["BIOS é a sigla de...","Basic Input/Output System",["Binary Internal Operating System","Basic Internet Online Service","Boot Input Output Software"],"Sistema Básico de Entrada e Saída: é o primeiro programa que roda ao ligar o PC."],
  ["ROM significa 'Read-Only Memory'. O que isso quer dizer?","Memória somente de leitura",["Memória de acesso rápido","Memória removível","Memória de vídeo"],"Read-only = apenas leitura. Os dados dela não são alterados no uso normal."]
 ]},
 { nome:"Dentro do processador", desc:"Clock, núcleos e cache", p:[
  ["Um processador de 4 GHz faz cerca de quantos ciclos por segundo?","4 bilhões",["4 milhões","4 mil","4 trilhões"],"Giga = bilhão. Quanto maior o clock, mais ciclos por segundo."],
  ["Em inglês, 'quad' quer dizer quatro. Quantos núcleos tem um processador quad-core?","4",["2","6","8"],"Dual-core = 2, quad-core = 4, octa-core = 8."],
  ["A sigla ALU, dentro da CPU, significa...","Arithmetic Logic Unit",["Advanced Link Utility","Auto Load Unit","Active Logic Update"],"Em português, ULA: faz as contas e as comparações lógicas."],
  ["Para que serve o cache do processador?","Guardar dados muito usados para acesso super rápido",["Armazenar fotos e vídeos","Resfriar o chip","Conectar ao Wi-Fi"],"'Cache' vem do francês 'cachette', esconderijo: uma memória rápida bem perto do núcleo."],
  ["'Over' significa 'acima de'. O que é overclock?","Fazer a CPU rodar acima da frequência de fábrica",["Desligar núcleos para economizar energia","Limpar o cache","Trocar a pasta térmica"],"Dá mais desempenho, mas esquenta mais e exige um bom cooler."],
  ["Para que serve a pasta térmica entre a CPU e o cooler?","Ajudar a passar o calor do chip para o cooler",["Isolar a CPU da energia","Colar a CPU na placa-mãe","Aumentar a memória RAM"],"Ela preenche microfalhas entre as superfícies e melhora a troca de calor."]
 ]},
 { nome:"Armazenamento", desc:"HD, SSD e unidades de medida", p:[
  ["HDD é a sigla de...","Hard Disk Drive",["Hard Data Device","High Disk Driver","Hybrid Digital Drive"],"É o HD tradicional, com pratos magnéticos giratórios."],
  ["Em 'Solid State Drive' (SSD), 'solid state' quer dizer 'estado sólido'. Isso indica que ele...","Não tem partes móveis",["Gira mais rápido que um HD","É feito de metal maciço","Só funciona ligado na tomada"],"Os dados ficam em chips de memória flash, sem disco girando."],
  ["Por que o SSD costuma ser mais rápido que o HDD?","Usa chips de memória flash em vez de discos giratórios",["Gira a mais RPM","Gasta mais energia","Tem um cooler próprio"],"Sem agulha para mover, o acesso aos dados é quase instantâneo."],
  ["Aproximadamente quantos megabytes (MB) cabem em 1 gigabyte (GB)?","Cerca de 1.000",["Cerca de 10","Cerca de 100","Cerca de 1 milhão"],"Mega = milhão e giga = bilhão de bytes. Na prática, 1 GB ≈ 1.000 MB."],
  ["Qual destes guarda os dados mesmo com o computador desligado?","Pen drive",["Memória RAM","Cache L1","Registradores da CPU"],"Memória não volátil (non-volatile) mantém os dados sem energia."],
  ["'Backup' é uma palavra inglesa. Qual é a melhor prática?","Manter cópias dos arquivos importantes em outro lugar",["Guardar tudo em um só disco","Apagar arquivos antigos","Formatar o PC toda semana"],"Disco externo ou nuvem: se um falhar, a cópia salva o seu trabalho."]
 ]},
 { nome:"Inglês técnico", desc:"Termos que aparecem em todo manual", p:[
  ["'Bottleneck' é 'gargalo da garrafa'. Em um PC, o que é?","Um componente lento que limita o desempenho dos outros",["Um defeito na caixa do PC","Um tipo de cabo de energia","Um modo de economia de bateria"],"Ex.: uma CPU forte com um HDD lento: o disco vira o gargalo."],
  ["Ao ligar o PC acontece o 'boot'. O que é isso?","O processo de inicialização do sistema",["A limpeza dos arquivos temporários","O desligamento seguro","Uma atualização de driver"],"Vem de 'bootstrap': o PC 'se levanta puxando as próprias botas'."],
  ["Um 'benchmark' é...","Um teste que mede o desempenho de um componente",["Um tipo de cabo","Um programa antivírus","Uma marca de SSD"],"Benchmark = ponto de referência: serve para comparar CPUs, SSDs e placas de vídeo."],
  ["'Firmware' (firm = firme, fixo) é...","Um software gravado no próprio hardware que o controla",["Uma peça de metal protetora","Um tipo de memória RAM","Um cabo de rede"],"Todo SSD tem firmware, e atualizá-lo pode corrigir falhas."],
  ["'Thermal throttling' acontece quando a CPU...","Reduz a velocidade para não superaquecer",["Aumenta o clock ao esfriar","É desligada pelo antivírus","Troca de núcleo"],"Throttle = 'estrangular': é uma proteção contra o calor excessivo."],
  ["'Plug and play' (conectar e usar) significa que...","O sistema reconhece o dispositivo automaticamente",["É preciso abrir o PC para instalar","O dispositivo só funciona com bateria","Só técnicos conseguem usar"],"Ex.: ao ligar um pen drive, ele aparece na hora."]
 ]},
 { nome:"Desafio final", desc:"Siglas de quem entende de hardware", p:[
  ["NVMe, o padrão dos SSDs mais velozes, significa...","Non-Volatile Memory Express",["New Video Memory Engine","Network Virtual Memory Extension","Non-Visible Media Exchange"],"'Non-volatile' = não volátil. Roda sobre o PCIe e é bem mais rápido que SATA."],
  ["SATA, interface de HDs e SSDs, é a sigla de...","Serial Advanced Technology Attachment",["System Archive Transfer Adapter","Storage And Transfer Architecture","Serial Access Transfer Array"],"Substituiu o antigo padrão paralelo (PATA/IDE)."],
  ["RAID junta vários discos para ganhar velocidade ou segurança. A sigla significa...","Redundant Array of Independent Disks",["Random Access Internal Drive","Rapid Archive of Integrated Data","Remote Array of Intelligent Disks"],"'Redundant' = redundante: os dados podem ser duplicados para não se perderem."],
  ["TDP, que aparece nas fichas técnicas de CPUs, significa...","Thermal Design Power",["Total Data Processing","Turbo Drive Performance","Temperature Display Panel"],"É o calor (em watts) que o cooler precisa dissipar."],
  ["Os chips ARM dos celulares usam a filosofia RISC. RISC significa...","Reduced Instruction Set Computer",["Rapid Input System Core","Remote Instruction Storage Chip","Random Instruction Set Code"],"Poucas instruções simples e rápidas: por isso gastam pouca energia."],
  ["PCIe é a sigla de 'Peripheral Component Interconnect Express'. Para que serve?","Ligar placas de vídeo e SSDs NVMe à placa-mãe em alta velocidade",["Conectar o monitor ao notebook","Carregar a bateria","Ligar o PC à internet"],"Peripheral = periférico, Interconnect = interconexão."]
 ]}
];

/* =====================================================================
   CONFIGURAÇÕES E PROGRESSO (salvo no navegador, com try/catch)
   ===================================================================== */
const TEMPO = 20, VIDAS = 3;
let S = { liberada:0, estrelas:[], recorde:0 };
try { S = Object.assign(S, JSON.parse(localStorage.getItem("silicio2") || "{}")); } catch(e){}
const salvar = () => { try { localStorage.setItem("silicio2", JSON.stringify(S)); } catch(e){} };
const app = document.getElementById("app");
let J = null, timer = null;                                  // J = estado da partida
const estrelas = n => "★".repeat(n) + "☆".repeat(3 - n);
const total = () => S.estrelas.reduce((a, b) => a + (b || 0), 0);
const embaralhar = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const patente = n => n >= 13 ? "Mestre do Silício" : n >= 9 ? "Engenheiro(a) de Hardware" : n >= 5 ? "Técnico(a) de Informática" : "Estagiário(a) de TI";

/* ===== TELA 1: MENU / MAPA DE FASES ===== */
function menu(){
  clearInterval(timer);
  app.innerHTML = `
   <div class="hero"><div class="chip">CPU</div><h1>Silício <span>&amp;</span> Bits</h1>
   <p class="sub">Quiz de processadores e armazenamento, com siglas e termos em inglês. Complete as ${FASES.length} fases!</p></div>
   <div class="map">${FASES.map((f, i) => {
     const trava = i > S.liberada;
     return `<button class="no" data-fase="${i}" ${trava ? "disabled" : ""}><i>${i + 1}</i><b>${f.nome}</b><small>${f.desc}</small><em>${trava ? "bloqueada" : estrelas(S.estrelas[i] || 0)}</em></button>`;
   }).join("")}</div>
   <p class="foot">★ ${total()}/${FASES.length * 3} · ${patente(total())} · Recorde: ${S.recorde} pts</p>`;
}

/* ===== INÍCIO DE UMA FASE ===== */
function iniciar(i){ J = { i, q:0, pts:0, vidas:VIDAS, erros:0, seq:0, usou:false, trava:false, t:TEMPO }; pergunta(); }

/* ===== TELA 2: PERGUNTA ===== */
function pergunta(){
  const f = FASES[J.i], [txt, certa, erradas] = f.p[J.q];
  J.opts = embaralhar([certa, ...erradas]); J.t = TEMPO; J.trava = false;
  app.innerHTML = `
   <div class="hud"><span class="pill">Fase ${J.i + 1} · ${J.q + 1}/${f.p.length}</span><span class="pill">${J.pts} pts</span><span class="pill vidas">${"♥".repeat(J.vidas)}</span></div>
   <div class="bar"><i id="barra"></i></div>
   <div class="q">${txt}</div>
   <div class="ops">${J.opts.map((o, k) => `<button class="op" data-k="${k}"><span class="k">${k + 1}</span>${o}</button>`).join("")}</div>
   <div id="fb"></div>
   <button class="btn sec" id="cinq" ${J.usou ? "disabled" : ""}>50/50 (1 por fase)</button>`;
  clearInterval(timer);
  timer = setInterval(() => {                                // cronômetro
    J.t = Math.max(0, J.t - 0.1);
    const b = document.getElementById("barra");
    if (b) { b.style.width = (J.t / TEMPO * 100) + "%"; b.classList.toggle("baixo", J.t < 6); }
    if (J.t <= 0) responder(-1);
  }, 100);
}

/* ===== RESPOSTA: confere, pontua e explica ===== */
function responder(k){
  if (J.trava) return; J.trava = true; clearInterval(timer);
  const [, certa, , exp] = FASES[J.i].p[J.q];
  const acertou = k >= 0 && J.opts[k] === certa;
  document.querySelectorAll(".op").forEach((b, idx) => {
    b.disabled = true;
    if (J.opts[idx] === certa) b.classList.add("certa"); else if (idx === k) b.classList.add("errada");
  });
  document.getElementById("cinq").disabled = true;
  if (acertou) { J.seq++; J.pts += 100 + Math.round(J.t) * 5 + 25 * Math.min(J.seq - 1, 3); }   // base + tempo + combo
  else { J.seq = 0; J.vidas--; J.erros++; }
  document.getElementById("fb").innerHTML = `<div class="exp"><strong>${acertou ? "Correto!" : (k < 0 ? "Tempo esgotado." : "Não foi dessa vez.")}</strong> ${exp}</div><button class="btn" id="prox">Continuar</button>`;
  document.getElementById("prox").focus();
}
function proxima(){
  if (J.vidas <= 0) return fim(false);
  J.q++; J.q >= FASES[J.i].p.length ? fim(true) : pergunta();
}

/* ===== TELA 3: RESULTADO ===== */
function fim(ok){
  clearInterval(timer);
  const est = ok ? Math.max(1, 3 - J.erros) : 0, ultima = J.i === FASES.length - 1;
  if (ok) { S.liberada = Math.max(S.liberada, Math.min(J.i + 1, FASES.length - 1)); S.estrelas[J.i] = Math.max(S.estrelas[J.i] || 0, est); }
  S.recorde = Math.max(S.recorde, J.pts); salvar();
  app.innerHTML = `<div class="fim">
   <h2>${ok ? (ultima ? "Você dominou o silício!" : "Fase concluída!") : "Acabaram as vidas. Tente de novo!"}</h2>
   <div class="est">${[0, 1, 2].map(n => `<span style="animation-delay:${n * .18}s">${n < est ? "★" : "☆"}</span>`).join("")}</div>
   ${ok && ultima ? `<div class="rank">${patente(total())}</div>` : ""}
   <p>Pontuação: <strong>${J.pts}</strong> · Erros: ${J.erros}</p>
   ${ok && !ultima ? `<button class="btn" data-fase="${J.i + 1}">Próxima fase</button>` : ""}
   <button class="btn ${ok && !ultima ? "sec" : ""}" data-fase="${J.i}">Jogar de novo</button>
   <button class="btn sec" id="menu">Mapa de fases</button></div>`;
}

/* ===== EVENTOS (um único ouvinte de clique para o jogo todo) ===== */
app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.fase !== undefined) iniciar(+t.dataset.fase);
  else if (t.classList.contains("op")) responder(+t.dataset.k);
  else if (t.id === "prox") proxima();
  else if (t.id === "menu") menu();
  else if (t.id === "cinq" && !J.usou && !J.trava) {         // 50/50: esconde 2 erradas
    J.usou = true; t.disabled = true;
    const certa = FASES[J.i].p[J.q][1];
    embaralhar([...document.querySelectorAll(".op")].filter((b, k) => J.opts[k] !== certa)).slice(0, 2).forEach(b => b.classList.add("some"));
  }
});
document.addEventListener("keydown", e => {                  // teclas 1 a 4 respondem
  if (!J || !document.querySelector(".op:not(:disabled)")) return;
  if (e.key >= "1" && e.key <= "4") { const b = document.querySelector(`.op[data-k="${e.key - 1}"]`); if (b && !b.classList.contains("some")) responder(e.key - 1); }
});
menu();
</script>
</body>
</html>
