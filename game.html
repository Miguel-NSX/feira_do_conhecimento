<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Processadores e Armazenamento – Quiz da Feira do Conhecimento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* ===== CORES (tema escuro por padrão; claro se o sistema preferir) ===== */
:root{--bg:#0a0f24;--panel:#131a3a;--ink:#eef2ff;--mut:#9aa6d0;--cu:#f5a54a;--cy:#46e6d6;--vi:#8b7dff;--ok:#5be3a0;--err:#ff6b81;--line:#2a3465;--grid:rgba(70,230,214,.06);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eff2fb;--panel:#fff;--ink:#17204a;--mut:#56608a;--cu:#c4701a;--cy:#0b8f86;--vi:#5b4bd6;--ok:#0f9a62;--err:#d1405a;--line:#cdd4ea;--grid:rgba(11,143,134,.08)}}
:root[data-theme="dark"]{--bg:#0a0f24;--panel:#131a3a;--ink:#eef2ff;--mut:#9aa6d0;--cu:#f5a54a;--cy:#46e6d6;--vi:#8b7dff;--ok:#5be3a0;--err:#ff6b81;--line:#2a3465;--grid:rgba(70,230,214,.06)}
html,body{margin:0;min-height:100%}
/* fundo: dois brilhos (ciano e violeta) sobre uma malha de placa de circuito */
body{background:radial-gradient(760px 460px at 12% -6%,color-mix(in srgb,var(--cy) 24%,transparent),transparent),
 radial-gradient(680px 460px at 98% 4%,color-mix(in srgb,var(--vi) 26%,transparent),transparent),
 linear-gradient(var(--grid) 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/36px 36px,var(--bg);
 background-attachment:fixed;color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:740px;padding:26px 18px 44px;box-sizing:border-box}
h1,h2,.no i,.btn,th{font-family:"Chakra Petch",Verdana,sans-serif}
button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
/* abertura: título em degradê e o desenho do processador ligado ao SSD */
.hero{text-align:center;margin-bottom:28px}
.logo{display:block;width:min(340px,88%);height:auto;margin:4px auto 16px}
.fio{stroke:var(--cy);stroke-width:3;stroke-linecap:round;stroke-dasharray:6 10;animation:corre 1.1s linear infinite}
@keyframes corre{to{stroke-dashoffset:-32}}
h1{font-size:clamp(1.75rem,6.4vw,2.8rem);line-height:1.12;margin:0;letter-spacing:.5px;background:linear-gradient(90deg,var(--ink),var(--cy) 55%,var(--vi));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1 span{-webkit-text-fill-color:var(--cu);color:var(--cu)}
h2{margin:.2em 0}
.sub{color:var(--mut);margin:.6em auto 0;max-width:48ch}
/* mapa da missão: fases ligadas por uma trilha */
.map{display:grid;gap:14px;position:relative;padding-left:28px;text-align:left}
.map::before{content:"";position:absolute;left:12px;top:24px;bottom:24px;width:3px;background:linear-gradient(var(--cy),var(--vi));opacity:.55;border-radius:2px}
.no{display:grid;grid-template-columns:auto 1fr auto;gap:0 14px;align-items:center;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;cursor:default}
.no::before{content:"";position:absolute;left:-23px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--cy);box-shadow:0 0 12px var(--cy)}
.no i{grid-row:1/3;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;font-style:normal;font-size:1.3rem;font-weight:700;color:var(--cu);background:color-mix(in srgb,var(--cu) 16%,transparent);border:1px solid var(--cu)}
.no b{font-weight:600}.no small{color:var(--mut)}
.no em{grid-row:1/3;grid-column:3;font-style:normal;color:var(--cu);font-size:.9rem}
.no:not(.atual):not(.fut){border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.no:not(.atual):not(.fut) i{color:var(--ok);border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.no:not(.atual):not(.fut) em{color:var(--ok)}
.no.atual{border-color:var(--cu);box-shadow:0 0 0 1px var(--cu),0 0 30px color-mix(in srgb,var(--cu) 28%,transparent)}
.no.fut{opacity:.5}.no.fut::before{background:var(--line);box-shadow:none}.no.fut i{color:var(--mut);border-color:var(--line);background:none}
.foot{text-align:center;color:var(--mut);margin-top:26px}
/* pergunta */
.hud{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-weight:600;font-size:.92rem}
.pill{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:99px;padding:3px 14px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cy),var(--vi));box-shadow:0 0 12px var(--cy);transition:width .1s linear}
.bar i.baixo{background:var(--err);box-shadow:0 0 12px var(--err)}
.q{background:linear-gradient(160deg,color-mix(in srgb,var(--panel) 80%,var(--vi)),var(--panel));border:1px solid var(--line);border-left:5px solid var(--cu);border-radius:14px;padding:24px 22px;font:700 1.32rem/1.35 "Chakra Petch",sans-serif;margin-bottom:16px;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.ops{display:grid;gap:10px}
.op{display:flex;gap:14px;align-items:center;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:12px;padding:13px 16px;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not(:disabled){border-color:var(--cy);transform:translateX(4px)}
.op .k{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--cy),var(--vi));color:#0a0f24;font:700 .95rem "Chakra Petch",sans-serif}
.op.certa{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--panel));animation:pulso .5s}
.op.errada{border-color:var(--err);background:color-mix(in srgb,var(--err) 20%,var(--panel));animation:tremer .4s}
.op.some{visibility:hidden}
@keyframes pulso{50%{transform:scale(1.025)}}
@keyframes tremer{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{background:linear-gradient(135deg,var(--cu),#ffd08a);color:#1b1206;border:0;border-radius:10px;padding:12px 24px;font-weight:700;font-size:1rem;cursor:pointer;margin:16px 10px 0 0;box-shadow:0 6px 22px color-mix(in srgb,var(--cu) 35%,transparent);transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.exp{margin-top:16px;padding:13px 16px;border-left:4px solid var(--cy);background:color-mix(in srgb,var(--panel) 88%,transparent);border-radius:0 10px 10px 0;color:var(--mut)}
.exp strong{color:var(--ink)}
.fim{text-align:center;padding-top:24px}
.rank{display:inline-block;border:1px solid var(--cu);border-radius:99px;padding:5px 20px;color:var(--cu);font:700 1.1rem "Chakra Petch",sans-serif;margin:8px 0 12px;box-shadow:0 0 24px color-mix(in srgb,var(--cu) 25%,transparent)}
/* nome do jogador, painel de admin e tabela */
.caixa{display:grid;gap:12px;max-width:380px;margin:0 auto;text-align:center}
.caixa .btn{margin:0}
input{font:inherit;color:var(--ink);background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:10px;padding:13px 14px;text-align:center}
input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.erro{color:var(--err);min-height:1.4em;margin:0}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer}
.rolar{overflow-x:auto;margin:14px 0 4px;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:color-mix(in srgb,var(--panel) 90%,transparent)}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--cu)}tbody tr:first-child td{color:var(--cu);font-weight:600}tbody tr:last-child td{border-bottom:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   BANCO DE PERGUNTAS  (cada fase = um apresentador)
   Cada pergunta: [enunciado, resposta certa, [3 erradas], explicação]
   As alternativas são embaralhadas na hora de jogar.
   ===================================================================== */
const FASES = [
 { nome:"O que é um processador?", desc:"Conceito, função e onde encontramos", p:[
  ["O que é um processador?","O componente que executa as instruções e faz os cálculos do computador",["A memória onde os arquivos ficam guardados para sempre","A tela que mostra as imagens do computador","O cabo que liga o computador à tomada"],"Também chamado de CPU, é o 'cérebro' do computador."],
  ["A sigla CPU significa...","Central Processing Unit (Unidade Central de Processamento)",["Computer Power Unit (Unidade de Energia)","Central Program Utility (Utilitário de Programas)","Core Processing Update (Atualização de Núcleos)"],"Em inglês: Central Processing Unit."],
  ["Qual é a principal função do processador?","Interpretar e executar as instruções dos programas",["Guardar fotos e vídeos de forma permanente","Resfriar os outros componentes do computador","Aumentar o sinal do Wi-Fi"],"Tudo o que o computador faz passa por instruções executadas pelo processador."],
  ["Onde o processador fica em um computador de mesa?","Encaixado na placa-mãe, debaixo do cooler",["Dentro do HD","Atrás do monitor","Preso ao teclado"],"A placa-mãe é a peça que conecta todos os componentes."],
  ["Em qual destes itens NÃO encontramos um processador?","Em uma cadeira comum de madeira",["Em um celular","Em um videogame","Em uma Smart TV"],"Eletrônicos que executam programas precisam de um processador."],
  ["Além de computadores, onde mais existem processadores?","Em celulares, TVs, carros e eletrodomésticos inteligentes",["Apenas em computadores de empresas","Apenas em celulares","Apenas em servidores da internet"],"Hoje há processadores em quase todo aparelho eletrônico inteligente."]
 ]},
 { nome:"Funcionamento e tipos", desc:"Núcleos, GHz, fabricantes e desempenho", p:[
  ["Como um processador funciona, de forma simples?","Busca uma instrução, interpreta e executa, repetindo isso muito rápido",["Só guarda dados quando o computador é desligado","Apenas liga e desliga a tela","Copia arquivos para o HD o tempo todo"],"É o ciclo buscar, decodificar e executar, repetido bilhões de vezes por segundo."],
  ["O que é um núcleo (core) do processador?","Uma unidade que executa tarefas; mais núcleos fazem mais tarefas ao mesmo tempo",["Um tipo de memória externa","A parte que esquenta a placa de vídeo","O encaixe onde o cooler é preso"],"Dual-core tem 2 núcleos, quad-core tem 4, octa-core tem 8."],
  ["O que a frequência em GHz indica?","Quantos bilhões de ciclos o processador faz por segundo",["Quantos gigabytes de arquivos ele guarda","Quanta energia ele consome","O tamanho físico do chip"],"1 GHz = 1 bilhão de ciclos por segundo."],
  ["Quais são as duas principais fabricantes de processadores para computadores?","Intel e AMD",["Samsung e LG","Nvidia e Sony","Dell e HP"],"Intel (linha Core) e AMD (linha Ryzen)."],
  ["Qual destes fatores influencia o desempenho do processador?","Número de núcleos e frequência (GHz)",["A cor da caixa do computador","O tamanho do monitor","A marca do teclado"],"Cache e tecnologia de fabricação também contam."],
  ["Um processador de 4 núcleos, comparado a um de 2 núcleos da mesma tecnologia, tende a...","Lidar melhor com várias tarefas ao mesmo tempo",["Guardar mais arquivos","Ter uma tela maior","Funcionar sem energia"],"Mais núcleos ajudam em multitarefa, como jogar com programas abertos."]
 ]},
 { nome:"O que são unidades de armazenamento?", desc:"Conceito, função, HD e SSD", p:[
  ["O que é uma unidade de armazenamento?","Um dispositivo que guarda dados e arquivos",["Um dispositivo que executa os cálculos","Um dispositivo que só mostra imagens","Um tipo de cabo de rede"],"Ela mantém os dados guardados mesmo com o computador desligado."],
  ["Qual é a função das unidades de armazenamento?","Guardar o sistema, os programas e os arquivos para usar depois",["Executar as instruções dos programas","Resfriar o processador","Conectar o computador à internet"],"Fotos, músicas, documentos e jogos ficam guardados nelas."],
  ["A sigla HD significa...","Hard Disk (disco rígido)",["High Definition (alta definição)","Hardware Data (dados de hardware)","Hybrid Display (tela híbrida)"],"Também chamado de HDD (Hard Disk Drive)."],
  ["A sigla SSD significa...","Solid State Drive (unidade de estado sólido)",["Super Speed Disk (disco super veloz)","Single Storage Device (dispositivo único)","System Save Drive (unidade de salvamento)"],"'Estado sólido' porque não tem peças que se movem."],
  ["Qual destes é um exemplo de unidade de armazenamento?","Pen drive",["Teclado","Mouse","Monitor"],"Outros exemplos: HD, SSD, cartão de memória e CD/DVD."],
  ["Onde o sistema operacional e os programas costumam ficar instalados?","No HD ou no SSD",["Na fonte de energia","No cooler","No monitor"],"O sistema fica guardado na unidade e é carregado quando o computador liga."]
 ]},
 { nome:"Tipos de armazenamento e diferenças", desc:"HD, SSD, pen drive, cartão e comparações", p:[
  ["Como o HD guarda os dados?","Em discos magnéticos que giram",["Em chips de memória flash","Em lâmpadas de LED","Em ondas de rádio"],"Uma cabeça de leitura se move sobre os discos para ler e gravar."],
  ["Qual é uma vantagem do SSD sobre o HD?","É muito mais rápido e não tem partes móveis",["Costuma ser bem mais barato por GB","Gira mais rápido que o HD","É sempre maior fisicamente"],"Por isso o computador liga e abre programas bem mais depressa."],
  ["Para que serve o cartão de memória (microSD)?","Guardar fotos, vídeos e arquivos em celulares e câmeras",["Aumentar a frequência do processador","Resfriar o celular","Carregar a bateria"],"É pequeno, removível e fácil de trocar."],
  ["Qual é uma característica do pen drive?","É portátil e se conecta pela porta USB",["Fica soldado na placa-mãe","Só funciona com Wi-Fi","Só guarda arquivos de texto"],"Serve para levar e passar arquivos entre computadores."],
  ["Comparando HD e SSD, qual costuma custar menos por gigabyte?","O HD",["O SSD","Os dois custam exatamente o mesmo","Depende só da cor do aparelho"],"O HD oferece mais capacidade pelo mesmo preço; o SSD vale pela velocidade."],
  ["Qual unidade é mais indicada para o computador ligar e abrir programas mais rápido?","SSD",["HD","Pen drive","Cartão de memória"],"A diferença de velocidade do SSD é perceptível no dia a dia."]
 ]},
 { nome:"Importância e funcionamento conjunto", desc:"Processador, RAM e armazenamento", p:[
  ["Qual é a diferença entre processador e armazenamento?","O processador executa as tarefas e o armazenamento guarda os dados",["O processador guarda os arquivos e o armazenamento faz os cálculos","São a mesma peça com nomes diferentes","Os dois servem apenas para resfriar o computador"],"Um processa, o outro guarda."],
  ["O que é a memória RAM?","Uma memória rápida e temporária, usada enquanto o computador está ligado",["Uma memória permanente que guarda os arquivos","Um tipo de processador","Um cabo que liga o monitor"],"RAM = Random Access Memory. Ao desligar o computador, o conteúdo dela se perde."],
  ["Quando você abre um jogo, o que acontece?","Os dados vão do armazenamento para a RAM e o processador os executa",["O processador entra dentro do HD","O jogo roda direto da tela","O monitor guarda o jogo"],"Os três componentes trabalham juntos."],
  ["Qual é um exemplo do dia a dia de processador e armazenamento trabalhando juntos?","Abrir uma foto salva no celular",["Carregar o celular na tomada","Acender uma lâmpada comum","Ouvir o rádio de pilha antigo"],"A foto vem do armazenamento e o processador a mostra na tela."],
  ["Curiosidade: qual é a ordem de velocidade, da mais rápida para a mais lenta?","Cache do processador, RAM, SSD, HD",["HD, SSD, RAM, cache do processador","RAM, HD, cache do processador, SSD","SSD, HD, RAM, cache do processador"],"Por isso os computadores usam memórias rápidas como 'atalhos'."],
  ["Qual é a melhor conclusão sobre esses componentes?","O computador funciona bem quando processador, RAM e armazenamento trabalham em conjunto",["Só o processador é importante","Só o armazenamento importa","A RAM pode substituir o HD e o SSD"],"Cada peça tem seu papel, e o desempenho depende do equilíbrio entre elas."]
 ]}
];

/* =====================================================================
   CONFIGURAÇÕES  (edite aqui)
   ===================================================================== */
const TEMPO = 20;                 // segundos por pergunta
const ADMIN_PIN = "miajd0000";    // senha do painel de admin
const ENVIO_URL = "";             // opcional: link do Google Apps Script para juntar pontos de todos os aparelhos

const TOTAL = FASES.reduce((s, f) => s + f.p.length, 0);
const app = document.getElementById("app");
let R = null, timer = null, t = 0, opts = [], logado = false;   // R = partida em andamento

/* ===== ARMAZENAMENTO NO NAVEGADOR (sem login) ===== */
const ler = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch (e) { return d; } };
const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const ranking = () => ler("pa_rank", []);
const salvarRun = () => gravar("pa_run", R);
R = ler("pa_run", null);

/* ===== FUNÇÕES AUXILIARES ===== */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const embaralhar = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const onde = pos => { for (let f = 0; f < FASES.length; f++) { const n = FASES[f].p.length; if (pos < n) return { f, q: pos }; pos -= n; } return null; };  // posição global -> fase e pergunta
const patente = p => p >= .9 ? "Mestre do Silício" : p >= .7 ? "Engenheiro(a) de Hardware" : p >= .5 ? "Técnico(a) de Informática" : "Estagiário(a) de TI";

/* ===== TELA 1: NOME DO JOGADOR (sem conta, sem senha) ===== */
function inicio(){
  clearInterval(timer); logado = false;
  app.innerHTML = `
   <div class="hero"><svg class="logo" viewBox="0 0 320 96" role="img" aria-label="Processador ligado a uma unidade de armazenamento">
   <path d="M30 14v8M46 14v8M62 14v8M30 74v8M46 74v8M62 74v8M12 32h8M12 48h8M12 64h8M72 32h8M72 48h8M72 64h8" stroke="var(--cu)" stroke-width="3" stroke-linecap="round"/>
   <rect x="20" y="22" width="52" height="52" rx="8" fill="var(--cu)"/><rect x="32" y="34" width="28" height="28" rx="4" fill="#1b1206" opacity=".85"/>
   <path class="fio" d="M82 48H238"/>
   <rect x="242" y="26" width="64" height="44" rx="8" fill="none" stroke="var(--cy)" stroke-width="3"/>
   <rect x="252" y="36" width="20" height="24" rx="3" fill="var(--cy)" opacity=".85"/><rect x="278" y="36" width="20" height="24" rx="3" fill="var(--cy)" opacity=".5"/></svg>
   <h1>Processadores <span>&amp;</span> Armazenamento</h1>
   <p class="sub">Quiz da Feira do Conhecimento: ${TOTAL} perguntas em ${FASES.length} fases. Cada resposta é definitiva, não dá para voltar nem refazer.</p></div>
   <div class="caixa"><input id="nome" maxlength="24" placeholder="Digite seu nome" autocomplete="off">
   <button class="btn" data-a="comecar">Começar</button><p class="erro" id="erro"></p></div>
   <p class="foot"><button class="link" data-a="admin">Admin</button></p>`;
}
function comecar(){
  const nome = document.getElementById("nome").value.trim(), erro = document.getElementById("erro");
  if (nome.length < 2) { erro.textContent = "Digite pelo menos 2 letras."; return; }
  if (ranking().some(r => r.nome.toLowerCase() === nome.toLowerCase())) { erro.textContent = "Esse nome já jogou. Use outro nome."; return; }
  R = { nome, pos:0, pts:0, ac:0, er:0, seq:0, pend:false, usou:false, salvo:false, fa:[] };
  salvarRun(); seguir();
}

/* ===== FLUXO: sempre para frente ===== */
function seguir(){
  if (R.pos >= TOTAL) return fim();
  const { f, q } = onde(R.pos);
  q === 0 ? intro(f) : pergunta();
}
function intro(f){                                            // mapa: fases feitas ficam só para consulta, sem botão de voltar
  const fa = R.fa || [];
  app.innerHTML = `<div class="hero"><h2>Mapa da missão</h2><p class="sub">Só dá para seguir em frente. Errou? Sem problema: o jogo continua para o próximo desafio.</p></div>
   <div class="map">${FASES.map((x, i) => `<div class="no ${i === f ? "atual" : i > f ? "fut" : ""}"><i>${i + 1}</i><b>${x.nome}</b><small>${x.desc}</small><em>${i < f ? (fa[i] || 0) + "/" + x.p.length + " acertos" : i === f ? "agora" : "bloqueada"}</em></div>`).join("")}</div>
   <div class="fim"><button class="btn" data-a="pergunta">Iniciar fase ${f + 1}</button></div>`;
}

/* ===== TELA 2: PERGUNTA ===== */
function pergunta(){
  const { f, q } = onde(R.pos), [txt, certa, erradas] = FASES[f].p[q];
  opts = embaralhar([certa, ...erradas]); t = TEMPO;
  R.pend = true; salvarRun();                                  // se recarregar a página agora, a pergunta conta como erro
  app.innerHTML = `
   <div class="hud"><span class="pill">${esc(R.nome)}</span><span class="pill">Fase ${f + 1} · ${q + 1}/${FASES[f].p.length}</span><span class="pill">${R.pts} pts</span></div>
   <div class="bar"><i id="barra"></i></div>
   <div class="q">${txt}</div>
   <div class="ops">${opts.map((o, k) => `<button class="op" data-k="${k}"><span class="k">${k + 1}</span>${o}</button>`).join("")}</div>
   <div id="fb"></div>
   <button class="btn sec" id="cinq" data-a="cinq" ${R.usou ? "disabled" : ""}>50/50 (1 por jogo)</button>`;
  clearInterval(timer);
  timer = setInterval(() => {
    t = Math.max(0, t - 0.1);
    const b = document.getElementById("barra");
    if (b) { b.style.width = (t / TEMPO * 100) + "%"; b.classList.toggle("baixo", t < 6); }
    if (t <= 0) responder(-1);
  }, 100);
}

/* ===== RESPOSTA DEFINITIVA: trava, pontua, já avança a posição ===== */
function responder(k){
  if (!R || !R.pend) return;                                   // já respondida: não há segunda chance
  clearInterval(timer);
  const { f, q } = onde(R.pos), [, certa, , exp] = FASES[f].p[q], ok = k >= 0 && opts[k] === certa;
  document.querySelectorAll(".op").forEach((b, i) => { b.disabled = true; if (opts[i] === certa) b.classList.add("certa"); else if (i === k) b.classList.add("errada"); });
  document.getElementById("cinq").disabled = true;
  if (ok) { R.fa = R.fa || []; R.fa[f] = (R.fa[f] || 0) + 1; R.ac++; R.seq++; R.pts += 100 + Math.round(t) * 5 + 25 * Math.min(R.seq - 1, 3); } else { R.er++; R.seq = 0; }
  R.pend = false; R.pos++; salvarRun();
  document.getElementById("fb").innerHTML = `<div class="exp"><strong>${ok ? "Correto!" : (k < 0 ? "Tempo esgotado." : "Não foi dessa vez.")}</strong> ${exp}</div>
   <button class="btn" data-a="seguir">${R.pos >= TOTAL ? "Ver resultado" : "Continuar"}</button>`;
  document.querySelector("[data-a=seguir]").focus();
}

/* ===== TELA 3: RESULTADO FINAL (grava no ranking uma única vez) ===== */
function fim(){
  clearInterval(timer);
  if (!R.salvo) {
    R.salvo = true; salvarRun();
    const reg = { nome:R.nome, pts:R.pts, ac:R.ac, er:R.er, data:new Date().toISOString() };
    const r = ranking(); r.push(reg); gravar("pa_rank", r);
    if (ENVIO_URL) { try { fetch(ENVIO_URL, { method:"POST", mode:"no-cors", body:JSON.stringify(reg) }).catch(() => {}); } catch (e) {} }
  }
  const top = ranking().sort((a, b) => b.pts - a.pts).slice(0, 5);
  app.innerHTML = `<div class="fim"><h2>Fim de jogo, ${esc(R.nome)}!</h2>
   <div class="rank">${patente(R.ac / TOTAL)}</div>
   <p><strong>${R.pts}</strong> pontos · ${R.ac} de ${TOTAL} acertos</p>
   <div class="rolar"><table><thead><tr><th>#</th><th>Nome</th><th>Pontos</th></tr></thead><tbody>${top.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.nome)}</td><td>${x.pts}</td></tr>`).join("")}</tbody></table></div>
   <button class="btn" data-a="novo">Próximo jogador</button></div>`;
}

/* ===== PAINEL DE ADMIN (protegido por PIN) ===== */
function admin(){
  app.innerHTML = `<h2>Painel do administrador</h2><div class="caixa"><input id="pin" type="password" placeholder="PIN" autocomplete="off">
   <button class="btn" data-a="entrar">Entrar</button><button class="btn sec" data-a="inicio">Voltar</button><p class="erro" id="erro"></p></div>`;
}
function painel(){
  const r = ranking().sort((a, b) => b.pts - a.pts), n = r.length, media = n ? Math.round(r.reduce((s, x) => s + x.pts, 0) / n) : 0;
  app.innerHTML = `<h2>Painel do administrador</h2>
   <div class="hud"><span class="pill">${n} jogadores</span><span class="pill">Média: ${media} pts</span><span class="pill">Maior: ${n ? r[0].pts : 0} pts</span></div>
   <div class="rolar"><table><thead><tr><th>#</th><th>Nome</th><th>Pontos</th><th>Acertos</th><th>Erros</th><th>Data</th></tr></thead><tbody>
   ${r.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.nome)}</td><td>${x.pts}</td><td>${x.ac}</td><td>${x.er}</td><td>${new Date(x.data).toLocaleString("pt-BR")}</td></tr>`).join("") || '<tr><td colspan="6">Ninguém jogou ainda.</td></tr>'}</tbody></table></div>
   <button class="btn" data-a="csv">Exportar CSV</button><button class="btn sec" data-a="limpar">Limpar ranking</button><button class="btn sec" data-a="inicio">Sair</button>`;
}
function csv(){                                               // baixa o ranking em planilha
  const lin = ["Nome;Pontos;Acertos;Erros;Data", ...ranking().sort((a, b) => b.pts - a.pts).map(x =>
    [/^[=+\-@]/.test(x.nome) ? "'" + x.nome : x.nome, x.pts, x.ac, x.er, x.data].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(";"))];
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + lin.join("\n")], { type:"text/csv" }));
  a.download = "ranking-processadores-armazenamento.csv"; a.click();
}

/* ===== EVENTOS ===== */
app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const a = b.dataset.a;
  if (b.classList.contains("op")) responder(+b.dataset.k);
  else if (a === "comecar") comecar();
  else if (a === "pergunta") pergunta();
  else if (a === "seguir") seguir();
  else if (a === "novo") { R = null; gravar("pa_run", null); inicio(); }
  else if (a === "admin") admin();
  else if (a === "inicio") inicio();
  else if (a === "entrar") { if (document.getElementById("pin").value === ADMIN_PIN) { logado = true; painel(); } else document.getElementById("erro").textContent = "PIN incorreto."; }
  else if (a === "csv" && logado) csv();
  else if (a === "limpar" && logado) {                        // dois cliques para confirmar
    if (b.dataset.sim) { gravar("pa_rank", []); painel(); } else { b.dataset.sim = 1; b.textContent = "Clique de novo para apagar tudo"; }
  }
  else if (a === "cinq" && R && R.pend && !R.usou) {          // 50/50: esconde 2 erradas
    R.usou = true; salvarRun(); b.disabled = true;
    const certa = FASES[onde(R.pos).f].p[onde(R.pos).q][1];
    embaralhar([...document.querySelectorAll(".op")].filter((x, k) => opts[k] !== certa)).slice(0, 2).forEach(x => x.classList.add("some"));
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.tagName === "INPUT") { const p = app.querySelector(".caixa .btn"); if (p) p.click(); return; }
  if (R && R.pend && e.key >= "1" && e.key <= "4") { const b = document.querySelector(`.op[data-k="${e.key - 1}"]`); if (b && !b.classList.contains("some")) responder(e.key - 1); }
});

/* ===== ABERTURA: se a página foi recarregada no meio do jogo, retoma sem voltar ===== */
if (R) { if (R.pend) { R.pend = false; R.er++; R.seq = 0; R.pos++; salvarRun(); } seguir(); } else inicio();
</script>
</body>
</html>
